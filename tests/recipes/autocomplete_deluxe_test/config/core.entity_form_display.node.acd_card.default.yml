langcode: en
status: true
dependencies:
  config:
    - field.field.node.acd_card.field_acd_two
    - node.type.acd_card
  module:
    - autocomplete_deluxe
    - path
id: node.acd_card.default
targetEntityType: node
bundle: acd_card
mode: default
content:
  created:
    type: datetime_timestamp
    weight: 10
    region: content
    settings: {}
    third_party_settings: {}
  path:
    type: path
    weight: 30
    region: content
    settings: {}
    third_party_settings: {}
  status:
    type: boolean_checkbox
    weight: 120
    region: content
    settings:
      display_label: true
    third_party_settings: {}
  title:
    type: string_textfield
    weight: -5
    region: content
    settings:
      size: 60
      placeholder: ''
    third_party_settings: {}
  uid:
    type: entity_reference_autocomplete
    weight: 5
    region: content
    settings:
      match_operator: CONTAINS
      size: 60
      placeholder: ''
      match_limit: 10
    third_party_settings: {}
  field_acd_two:
    type: autocomplete_deluxe
    weight: 20
    region: content
    settings:
      match_operator: CONTAINS
      autocomplete_route_name: autocomplete_deluxe.autocomplete
      size: 60
      selection_handler: default
      match_limit: 10
      min_length: 0
      delimiter: ''
      not_found_message_allow: true
      not_found_message: The term '@term' will be added
      new_terms: true
      no_empty_message: No terms could be found. Please type in order to add a new
        term.
    third_party_settings: {}
hidden:
  promote: true
  sticky: true
